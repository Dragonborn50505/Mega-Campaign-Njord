 #Events:
 MEGA_events.1.t:0 "Peasants and Burghers Revolt"
 MEGA_events.1.d:0 "The Regency of Widukind II Fróilaz-Traba, a foreign prince from Galicia, has since the passing of the late Prince Widukind I sparked much controversy. With ever-increasing taxes and tariffs on the peasantry and burgher guilds, most notably on the selling of fish, grain and salt, it seems that a breaking point has been reached. With thousands of armed peasants rising up against the forces of the Duchy in Ditmarschen, Lauenburg and Bremen, the Burgher Guilds in Hamburg and Lübeck have themselves banded together with foreign mercenaries, storming the royal palace and taking Widukind II prisoner. The members of the Regency, choosing their lives over action against the instability, has fled across the Danish straits into Sjaelland. \n \nWith the peasantry and burgher guilds now de-facto in power. The various leaders of the guilds and peasant bands have agreed to meet in Hamburg to decide the future of Holstein and the Electorate-Duchy."
 MEGA_events.1.a:0 "Long live the Republic!"

 MEGA_events.2.t:0 "If you see this event then somethings wrong"
 MEGA_events.2.d:0 "Kill yourself"
 MEGA_events.2.a:0 "Ok"

 MEGA_events.3.t:0 "Proclamation of the Hanseatic League"
 MEGA_events.3.d:0 "With the toppling of the Nobles, the ousting of the Regency of Widukind II, and Widukind himself stripped of his princely titles and placed in house arrest, the representatives from various peasant bands, burgher guilds and the Hansa merchants met today in Hamburg to decide the future of the Electorate-Duchy. The results of these discussions has placed the peasantry firmly as a Fourth Estate, with many privileges granted and secured. The Burgher Guilds have also been granted much autonomy within the cities, with tariffs and taxes revoked to ensure their economic freedom. The Hansa merchants, however, have seemingly come out on top of these discussions, with a 'Hansa-led Oligopoly' under the rule of Aedelbrecht von Hassel, one of the last members of the von Hassel dynastic family that used to rule the lands. A message has been sent to the Emperor of the Holy Roman Empire promising to continue the Electorate-Duchy, now an Electorate-Republic, as a strong continuing member of the Empire."
 MEGA_events.3.a:0 "Long live the Electorate-Republic! Long live the Hanseatic League!"

 MEGA_events.5.t:0 "Ascension of the Great Khan"
 MEGA_events.5.d:0 "The Mongol Empire, still sprawing across Eurasia, has so far been held together by the iron will and fearsome rule of the Khan. Total subjugation of the tribal leaders and tributary states are enforced by the feared cavalry hordes of the Khan. But with the recent passing of the aging Great Khan Khubilai, an emergency kurultai has elevated his youngest son- an accomplished but ruthless general- to the 'Skull Throne'. Always lacking his father's patience for compromise, the new Khan has embarked on a rule through total terror, ordering the immediate execution of prominent leaders suspected of disloyalty. \n \nThese purgers has fractured the fragile balance of power. Steppe clans now mobilize their hosts and there are talks of revolts and frontiers governors declaring autonomy. The Mongol Empire seemingly exits its previous harmonious stability, and enters into a violent struggle of survival."
 MEGA_events.5.a:0 "By blood we rule, by blood we fall."

 MEGA_events.6.t:0 "Rebellions in the Mongol Empire"
 MEGA_events.6.d:0 "Several pressures has turned the newly appointed Great Khan's recent purges into a catalyst for empire-wide unrest rather than a show of strength. The old power balance between Mongol elites and its Tatar, Khitan, Oghuz and other subjects has finally eroded into outright hatred. Generations of settled rule have tied the empire's economy to cities, guilds and agricultural taxes rather than plunder. Persian, Chinese and Turkic administrators and nobles wield increasing influence across the Empire's territories, who often play the rival Mongol clans against one another. Provincial governors, more keen on keeping their economic and political influences have begun declaring independence to protect their own interest rather than swearing fealty to a violent Great Khan. \n \nWith these mounting troubles, neighbouring states- long contained by Mongol dominance- sense weakness and have stopped paying their yearly tributes, quietly supporting revolts with arms, gold and advisors. Border regions facing both internal instability and foreign threats, choose self-rule as a matter of survival."
 MEGA_events.6.a:0 "The authority of the Great Khan is fragmenting."

 MEGA_events.7.t:0 "Proclamation of the Greater Usun Mongols"
 MEGA_events.7.d:0 "Sparked by the Great Khan's purges, the uprising of the Usun Mongols, a powerful and ancient tribe rooted in western Mongolia, has proven the weakness of the new Khan's authority. The Usun Mongols has managed to rally many disaffected clans across the Mongol heartland, uniting into the Greater Usun Mongol Federation. Led by a rival kurultai near the sacred grazing lands of the Altai frontier, the Greater Usun Mongols has attracted many smaller tribes, fearful of further purges, which has strengthened their numbers considerably. \n \nThe declaration has sent shockwaves throughout the Empire. For the first time, a major Mongol power has openly challenged the authority of the Great Khan and the Mongol Empire as a whole. Other autonomous regions watch closely, carefully studying and planning their own destinys independent of the Great Khan's illegitimate rule."

 MEGA_events.8.t:0 "Troubles in the Eastern Territories"
 MEGA_events.8.d:0 "In the eastern territories of the empire, the Chahar- long one of the most influential Mongol tribes- move swiftly as the empire continues to fracture. Long-standing rivals of the Oirats, who remain only semi-loyal to the Great Khan, the Chahar see an opportunity to break free from both control of the Great Khan and the influence of the Oirats. The leader of the Chahar horde assert that the eastern steppe must be ruled by a Khan who can command loyalty through strength and tradition, not fear. With this, the Chahar has elevated its own Khan, claiming the mandate to preserve order in the east. \n \nThe Oirats, still nominally loyal to the Great Khan, has openly declared the Chahar proclamation as an insurrection against the Khan. Skirmishes has erupted along the eastern frontier as Khan-backed forces clash with the Chahar cavalry."
 MEGA_events.8.a:0 "The Great Khan is grasping for legitimacy."

 MEGA_events.9.t:0 "The Cumans and the City of Sarai"
 MEGA_events.9.d:0 "A similar unraveling has now gripped the Empire's western borders. There, the Cumans, long-subjugated steppe warriors and experienced frontier auxiliaries of the Mongol Empire have risen up in open revolt against the Khan. Exploiting the chaos of civil war and the absence of the Khan's armies, they have managed to seize Sarai, the great city that used to serve as the western capital of the Mongol Empire and a symbol of its dominon over the Volga Steppe. The fall of Sarai is a devastating blow. Cut off from reinforcements and facing coordinated Cuman uprisings, the Great Khan has abandoned the west entirely, fleeing eastward into Central Asia to preserve what remains of his authority. Imperial administrators and loyal nobles scatter, while the Cumans proclaim the city liberated from Mongol rule, positioning themselves as masters of the western steppe and the Volga river. \n \nYet Mongol power in the west has not vanished completely. In the aftermath of Sarai’s capture, scattered Khan-loyal tribes, veteran generals, and remnants of imperial tumens rally together. From this desperate coalition emerges the Great Horde— a mobile, hard-hitting cavalry army bound not by territory, but by loyalty to the idea of the Khaganate itself. Their mission is singular and uncompromising: the recapture of Sarai and the restoration of order in the west. Raiding Cuman supply lines and crushing smaller rebel forces, the Great Horde has taken it upon themselves to rule the western territories and the Volga Steppe in the absence of the Great Khan. \n \nAs the Great Horde rides west to meet the Cuman forces -the Empire itself has split into civil war and anarchy."
 MEGA_events.9.a:0 "The Age of the Mongols has ended."

 MEGA_events.10.t:0 "The Collapse of the Mongols"
 MEGA_events.10.d:0 "The Great Khan, now barely ruling from Central Asia, commands loyalty in name only, his authority drowned out by constant war and betrayal. As the Chahar and Oirats duke it out in the east, the Great Horde and Cumans fight for the legendary city of Sarai. As cities burn, and the roads that once bound the Mongol Empire and Eurasia are left absent of trade, with only the occasional marching of cavalry hordes, the Mongol armies turn on another, fighting not for empire but for their own survival. By the mid 1400's, the Mongol Empire exists only in memory and as a chapter in future history books."
 MEGA_events.10.a:0 "The greatest empire the world has known is no longer."

